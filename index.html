<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitamin & Health Tracker</title>
    <meta name="description" content="Daily schedule and progress tracker for vitamins and health supplements." />
    <meta property="og:title" content="Vitamin & Health Tracker" />
    <meta property="og:description" content="Daily schedule and progress tracker for vitamins and health supplements." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Ignore WebSocket and HMR errors per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function (event) {
        var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('ws') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || '')) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1 || msg.indexOf('ws') !== -1) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
